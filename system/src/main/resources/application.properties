server.tomcat.relaxedQueryChars=<,>, [,\,],^,`,{,|,}
spring.application.name=questionnaire
server.port=8088

# Database credentials come from environment variables (see README).
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.name=defaultDataSource
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:doctor}?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

mybatis.type-aliases-package=com.pojo
mybatis.mapper-locations=classpath:Mapper/*.xml
